name: C/C++ CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pret/pokeemerald:latest

    steps:
      - name: Checkout Expansion 1.17.0
        uses: actions/checkout@v4
        with:
          repository: 'rh-hideout/pokeemerald-expansion'
          ref: 'expansion/1.17.0'

      - name: Compile GBA ROM
        run: |
          make -j$(nproc) DUMP_SYMS=0

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokeemerald-1.17.0
          path: pokeemerald.gba
