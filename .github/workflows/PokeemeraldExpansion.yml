name: Build Pokeemerald Expansion

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Fetch Upstream Tags & Switch to Expansion 1.17.0
        run: |
          git remote add upstream https://github.com/rh-hideout/pokeemerald-expansion.git || true
          git fetch upstream --tags
          git checkout tags/expansion/1.17.0 -b build-1.17.0

      - name: Install System Dependencies & ARM Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ gcc-arm-none-eabi libpng-dev make git pkg-config libarchive-tools

      - name: Install Pre-compiled agbcc Binaries
        run: |
          git clone https://github.com/pret/agbcc.git agbcc_temp
          cd agbcc_temp
          chmod +x install.sh
          ./install.sh ..
          cd ..
          rm -rf agbcc_temp

      - name: Compile GBA ROM
        run: make -j$(nproc) DUMP_SYMS=0

      - name: Upload Compiled ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokeemerald-1.17.0
          path: '*.gba'
